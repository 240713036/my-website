<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>数当てゲーム</title>
<link rel="stylesheet" href="../../default.css">
<script src="./kazuate-lesson.js" type="text/javascript" defer></script>
</head>

<body id ="kadai">
<div id="page-kadai">

<div id="main">
<section class="gamepage_01">
<p class="kazuate-des">
  数字を入力すると、ヒントが表示されます。<br>
  ヒントをもとに数字を絞り込み、正解を目指してください。<br><br>
  難易度は3種類。<br>
  かんたんは1から50、ふつうは1から100、むずかしいは1から200の値をとります。
</p>
<select id="kazuate-level">
  <option value="easy">かんたん</option>
  <option value="normal" selected>ふつう</option>
  <option value="hard">むずかしい</option>
</select>
<input type="text" id="kazuate-input" value=0>
<button id="ent">Enter</button>
<p id="kazuate-hint">数字を入力してください</p>
<p id="kazuate-count">試行回数：0</p>
</section>
</div>

</div>
</body>
</html>
